name: Diagnose 500 error

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: SSH and capture errors
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          port: ${{ secrets.SSH_PORT }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            APP=~/domains/harpy.id/public_html/lamasy

            echo "=== Search all error_log in domain ==="
            find ~/domains/harpy.id -name "error_log" 2>/dev/null

            echo ""
            echo "=== Last 50 lines of domain root error_log ==="
            tail -50 ~/domains/harpy.id/public_html/error_log 2>/dev/null || echo "no root error_log"

            echo ""
            echo "=== Direct PHP CLI test of login.php ==="
            cd $APP && php -d display_errors=1 -r '
              define("ROOT", "'$APP'");
              try {
                require_once ROOT . "/master/config/db.php";
                require_once ROOT . "/core/Database.php";
                $pdo = Database::get();
                echo "DB OK\n";
                $stmt = $pdo->query("SELECT 1");
                echo "Query OK: " . $stmt->fetchColumn() . "\n";
                echo "APP_URL = " . APP_URL . "\n";
                echo "DB_NAME = " . DB_NAME . "\n";
              } catch (Throwable $e) {
                echo "ERROR: " . $e->getMessage() . "\n";
                echo $e->getTraceAsString() . "\n";
              }
            ' 2>&1

            echo ""
            echo "=== POST simulation to login.php via curl from server ==="
            curl -sS -X POST -d "email=test@test.com&password=test&csrf=x" \
              -w "\nHTTP_CODE: %{http_code}\n" \
              https://lamasy.harpy.id/login.php 2>&1 | head -50

            echo ""
            echo "=== Re-check error_log after POST ==="
            find ~/domains/harpy.id -name "error_log" -mmin -5 2>/dev/null | while read f; do
              echo "--- $f ---"
              tail -30 "$f"
            done
